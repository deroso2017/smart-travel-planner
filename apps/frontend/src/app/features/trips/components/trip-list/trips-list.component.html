<div
  class="min-h-screen bg-[var(--mat-sys-surface)] text-[var(--mat-sys-on-surface)] p-6"
>
  <!-- Header -->
  <div class="flex items-center justify-between mb-10">
    <h2 class="text-2xl font-semibold flex items-center gap-2">
      <mat-icon class="text-[var(--mat-sys-primary)]">luggage</mat-icon>
      My Trips
    </h2>

    <button
      mat-flat-button
      color="primary"
      class="rounded-full px-5 flex items-center gap-2"
      (click)="navigateToCreateTrip()"
    >
      <mat-icon>add</mat-icon>
      New Trip
    </button>
  </div>

  <!-- Content -->
  @if (trips$ | async; as trips) {
    <!-- Empty state -->
    @if (trips.length === 0) {
      <div class="flex flex-col items-center justify-center py-24 text-center">
        <div
          class="w-20 h-20 rounded-full flex items-center justify-center bg-[var(--mat-sys-surface-container)] mb-5"
        >
          <mat-icon class="text-5xl text-[var(--mat-sys-primary)]">
            flight_takeoff
          </mat-icon>
        </div>

        <h3 class="text-xl font-semibold">No trips yet</h3>

        <p class="mt-2 text-[var(--mat-sys-on-surface-variant)] max-w-md">
          Start your journey by creating your first trip and explore new
          destinations.
        </p>

        <button
          mat-raised-button
          color="primary"
          class="mt-6 rounded-full px-6"
        >
          Create Trip
        </button>
      </div>
    } @else {
      <!-- Grid -->
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        @for (trip of trips; track trip.id) {
          <app-trip-card [trip]="trip"></app-trip-card>
        }
      </div>
    }
  }

  <!-- Loading -->
  @else {
    <div class="flex justify-center py-20">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }
</div>
